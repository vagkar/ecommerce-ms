spring:
    application:
        name: order-service

    datasource:
        url: jdbc:postgresql://localhost:5432/orderdb
        username: order
        password: order

    jpa:
        hibernate:
            ddl-auto: update
        open-in-view: false

    kafka:
        bootstrap-servers: localhost:29092
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
        consumer:
            group-id: order-service-payment
            auto-offset-reset: earliest
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
            properties:
                spring.json.trusted.packages: "com.ecommerce"
                spring.json.type.mapping: "com.ecommerce.payment.messaging.PaymentSucceededEvent:com.ecommerce.order.messaging.PaymentSucceededEvent,com.ecommerce.payment.messaging.PaymentFailedEvent:com.ecommerce.order.messaging.PaymentFailedEvent"

server:
    port: 8082

management:
    endpoints:
        web:
            exposure:
                include: health,info

app:
    product-service:
        base-url: http://localhost:8081
    kafka:
        topics:
            order-events: order.events
            payment-succeeded: payment.succeeded
            payment-failed: payment.failed