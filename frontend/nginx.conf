server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── API reverse proxy ────────────────────────────────────────────────────────
    # All API calls are prefixed with /api/ so they don't clash with Vue Router paths.
    # e.g. GET /api/products → product-service, but GET /products → index.html (SPA).
    # nginx strips the /api prefix and rewrites the path to what the backend expects.

    location /api/auth/ {
        proxy_pass http://user-service:8084/auth/;
    }

    location /api/products {
        proxy_pass http://product-service:8081/products;
    }

    location /api/orders {
        proxy_pass http://order-service:8082/orders;
    }

    location /api/cart {
        proxy_pass http://order-service:8082/cart;
    }

    # WebSocket (STOMP) — /ws has no Vue Router conflict so no /api prefix needed
    location /ws {
        proxy_pass http://order-service:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ── SPA routing ──────────────────────────────────────────────────────────────
    # Any path not matched above returns index.html so Vue Router handles it client-side
    location / {
        try_files $uri $uri/ /index.html;
    }
}